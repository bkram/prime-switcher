name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: keep if you need a specific Xcode for SDKs/build settings
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode + toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun swift --version

      # Ensure Swift 6.2 even if Xcode on runner is older
      - name: Set up Swift 6.2
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Verify Swift 6.2
        run: |
          swift --version
          swift --version | grep -q "Swift version 6.2"

      - name: Build DMG
        run: ./Scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: InputToOutputMonitor-dmg
          path: dist/InputToOutputMonitor.dmg
          if-no-files-found: error

      - name: Create GitHub release and attach DMG
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/InputToOutputMonitor.dmg
          generate_release_notes: true
