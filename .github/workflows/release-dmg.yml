name: Release DMG

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build-and-release:
    needs: checks
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: keep if you need a specific Xcode for SDKs/build settings
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Show Xcode + toolchain
        run: |
          xcodebuild -version
          xcode-select -p
          xcrun swift --version

      - name: Build DMG
        run: ./Scripts/make-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrimeSwitcher-dmg
          path: dist/PrimeSwitcher.dmg
          if-no-files-found: error

      - name: Create GitHub release and attach DMG
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrimeSwitcher.dmg
          generate_release_notes: true
